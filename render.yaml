services:
  - type: web
    name: echo-guard-iot
    runtime: docker
    plan: free
    
    # Build configuration
    dockerfilePath: ./Dockerfile
    buildCommand: "docker build -t echo-guard-iot:latest --build-arg VITE_BASE_PATH=/ ."
    
    # Port and environment
    port: 4000
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DB_PATH
        value: /var/data/echoguard.db
      - key: VITE_API_BASE_URL
        value: https://echo-guard-iot.onrender.com/api
    
    # Keep service warm
    autoDeploy: true
    domains:
      - echo-guard-iot.onrender.com
