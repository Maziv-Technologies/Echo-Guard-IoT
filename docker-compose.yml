services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: /
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DB_PATH: /app/server/data/echoguard.db
      VITE_API_BASE_URL: http://localhost:4000/api
    volumes:
      - echo-guard-data:/app/server/data
    restart: unless-stopped

volumes:
  echo-guard-data:
